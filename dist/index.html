<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gridiron Saturday 26</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Big+Shoulders+Display:wght@600;700;800;900&display=swap">
<style>/* Broadcast package: slanted dark panels laid over the turf, with first-down yellow and
   line-of-scrimmage blue as the only accents. Single dark look on purpose (it is a TV graphic). */
:root {
  --ink: #f3f5f8;
  --muted: #98a2b3;
  --panel: rgba(9, 13, 21, 0.9);
  --panel-solid: #0b1019;
  --raise: #141b28;
  --line: rgba(255, 255, 255, 0.12);
  --gold: #ffd21a;
  --blue: #2f7bff;
  --red: #ff4d4f;
  --team: #9e1b32;
  --font-display: "Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --font-ui: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --step--1: 0.78rem;
  --step-0: 0.92rem;
  --step-1: 1.15rem;
  --step-2: 1.6rem;
  --step-3: 2.6rem;
  --step-4: clamp(3.2rem, 8vw, 6.6rem);
  color-scheme: dark;
}

[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; background: #04060a; color: var(--ink); overflow: hidden; }
body { font-family: var(--font-ui); font-size: var(--step-0); -webkit-font-smoothing: antialiased; }
#app { position: fixed; inset: 0; background: #04060a; }
#stage { position: absolute; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
#ui { position: absolute; inset: 0; pointer-events: none; }
#ui button, #ui select { font-family: var(--font-ui); }
button:focus-visible, select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

/* ---------------------------------------------------------------- loading */
.loading {
  position: absolute; inset: 0; display: grid; place-content: center; gap: 12px; text-align: center;
  background: radial-gradient(120% 90% at 50% 100%, #10301a 0%, #04060a 60%); pointer-events: auto; z-index: 50;
  padding-inline: 16px;
}
.ld-mark { font-family: var(--font-display); font-weight: 900; font-size: var(--step-3); text-transform: uppercase; letter-spacing: 0.01em; }
.ld-mark em { font-style: normal; color: var(--gold); }
.ld-text { color: var(--muted); letter-spacing: 0.14em; text-transform: uppercase; font-size: var(--step--1); max-width: 46ch; }

/* ---------------------------------------------------------------- title */
.title-screen {
  position: absolute; inset: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 540px);
  gap: 24px; padding: max(24px, env(safe-area-inset-top, 0px)) 32px max(24px, env(safe-area-inset-bottom, 0px));
  pointer-events: auto; overflow-y: auto;
  background: linear-gradient(90deg, rgba(4, 6, 10, 0.88) 0%, rgba(4, 6, 10, 0.25) 45%, rgba(4, 6, 10, 0.1) 60%, rgba(4, 6, 10, 0.78) 100%);
}
.title-brand { align-self: end; padding-bottom: 4vh; min-width: 0; }
.brand-kicker { color: var(--gold); text-transform: uppercase; letter-spacing: 0.22em; font-size: var(--step--1); font-weight: 600; }
.brand-mark {
  margin: 8px 0 12px; font-family: var(--font-display); font-weight: 900; text-transform: uppercase;
  font-size: var(--step-4); line-height: 0.82; letter-spacing: -0.01em; display: grid; text-wrap: balance;
}
.brand-mark span:first-child { color: var(--ink); }
.brand-mark span:nth-child(2) { color: transparent; -webkit-text-stroke: 2px var(--ink); }
.brand-mark em {
  font-style: normal; color: #111; background: var(--gold); justify-self: start; padding: 0.04em 0.14em 0;
  font-size: 0.5em; line-height: 1; margin-top: 0.12em; transform: skewX(-12deg);
}
.brand-line { max-width: 42ch; color: #cfd5df; line-height: 1.5; margin: 0; }

.title-panel {
  align-self: center; background: var(--panel); border: 1px solid var(--line); padding: 20px;
  display: grid; gap: 16px; min-width: 0; backdrop-filter: blur(6px);
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%);
}
.matchup { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: start; }
.vs { font-family: var(--font-display); font-weight: 900; font-size: var(--step-2); color: var(--muted); align-self: center; }
.pick-label { text-transform: uppercase; letter-spacing: 0.16em; font-size: var(--step--1); color: var(--muted); margin-bottom: 8px; }
.team-list { display: grid; gap: 4px; max-height: 300px; overflow-y: auto; padding-right: 2px; }
.team-btn {
  display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 8px; align-items: center; text-align: left;
  background: var(--raise); color: var(--ink); border: 1px solid transparent; padding: 5px 8px 5px 5px; cursor: pointer;
}
.team-btn:hover { border-color: var(--line); }
.team-btn.on { border-color: var(--gold); background: #1b2333; }
.swatch {
  width: 34px; height: 34px; display: grid; place-items: center; background: var(--c1);
  box-shadow: inset 0 -5px 0 var(--c2);
}
.swatch b { font-family: var(--font-display); font-weight: 900; font-size: 1.25rem; color: #fff; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); }
.tname { display: grid; min-width: 0; }
.tname strong { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tname small { color: var(--muted); font-size: var(--step--1); }
.ovr { font-family: var(--font-display); font-weight: 800; font-size: var(--step-1); font-variant-numeric: tabular-nums; color: var(--gold); }
.settings { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; }
.settings label { display: grid; gap: 4px; font-size: var(--step--1); color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
.settings select {
  background: var(--raise); color: var(--ink); border: 1px solid var(--line); padding: 7px 8px; font-size: var(--step-0);
  text-transform: none; letter-spacing: 0;
}
.btn-primary {
  background: var(--gold); color: #111; border: 0; padding: 13px 18px; font-family: var(--font-display) !important;
  font-weight: 900; font-size: var(--step-2); text-transform: uppercase; letter-spacing: 0.02em; cursor: pointer;
  clip-path: polygon(10px 0, 100% 0, calc(100% - 10px) 100%, 0 100%); display: flex; justify-content: center; align-items: center; gap: 12px;
}
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost {
  background: transparent; color: var(--ink); border: 1px solid var(--line); padding: 10px 14px; cursor: pointer; font-size: var(--step-0);
}
.btn-ghost:hover { border-color: var(--gold); }
.kbd { font-family: var(--font-ui); font-size: var(--step--1); font-weight: 600; border: 1px solid rgba(0, 0, 0, 0.35); padding: 1px 6px; letter-spacing: 0.04em; }
.controls-hint { margin: 0; color: var(--muted); font-size: var(--step--1); line-height: 1.5; }

/* ---------------------------------------------------------------- HUD */
.hud { position: absolute; inset: 0; }
.scorebug {
  position: absolute; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
  display: flex; align-items: stretch; height: 46px; max-width: calc(100% - 32px);
  background: var(--panel-solid); box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
  clip-path: polygon(14px 0, 100% 0, calc(100% - 14px) 100%, 0 100%);
  font-variant-numeric: tabular-nums;
}
.sb-team { display: flex; align-items: center; gap: 10px; padding: 0 16px 0 22px; position: relative; background: linear-gradient(90deg, var(--c1), color-mix(in srgb, var(--c1) 55%, #000)); min-width: 0; }
.sb-team + .sb-team { padding-left: 16px; }
.sb-abbr { font-family: var(--font-display); font-weight: 800; font-size: 1.35rem; letter-spacing: 0.02em; text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5); }
.sb-score { font-family: var(--font-display); font-weight: 900; font-size: 1.85rem; min-width: 1.6ch; text-align: right; }
.sb-poss { width: 10px; height: 6px; border-radius: 50%; background: transparent; }
.sb-team.has-ball .sb-poss { background: var(--gold); box-shadow: 0 0 8px var(--gold); }
.sb-clock, .sb-down { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-left: 1px solid var(--line); white-space: nowrap; }
.sb-q { color: var(--muted); font-weight: 700; font-size: var(--step--1); text-transform: uppercase; letter-spacing: 0.08em; }
.sb-time { font-family: var(--font-display); font-weight: 800; font-size: 1.5rem; }
.sb-dd { font-family: var(--font-display); font-weight: 800; font-size: 1.3rem; color: var(--gold); text-transform: uppercase; }
.sb-spot { color: var(--muted); font-size: var(--step--1); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; padding-right: 8px; }

.ticker {
  position: absolute; top: calc(16px + env(safe-area-inset-top, 0px)); left: 16px; max-width: min(420px, calc(100% - 32px));
  background: var(--panel); border-left: 4px solid var(--gold); padding: 9px 14px; font-weight: 600; font-size: var(--step-0);
}
.ticker.in { animation: slide-in 0.35s ease-out; }

.banner {
  position: absolute; left: 0; right: 0; top: 22%; display: grid; justify-items: center; gap: 4px; text-align: center; padding-inline: 16px;
}
.banner-main {
  font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: clamp(2.4rem, 7vw, 5.4rem);
  line-height: 0.9; letter-spacing: 0.01em; padding: 0.08em 0.3em 0.02em; color: #111; background: var(--gold);
  transform: skewX(-10deg); box-shadow: 0 14px 40px rgba(0, 0, 0, 0.45); text-wrap: balance; max-width: 100%;
}
.banner[data-tone="red"] .banner-main { background: var(--red); color: #fff; }
.banner[data-tone="muted"] .banner-main { background: var(--panel-solid); color: var(--ink); }
.banner-sub { background: var(--panel-solid); padding: 6px 14px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.12em; font-size: var(--step--1); }
.banner-sub:empty { display: none; }
.banner.in .banner-main { animation: wipe 0.45s cubic-bezier(.2, .8, .2, 1); }
.banner.in .banner-sub { animation: slide-up 0.5s 0.1s both ease-out; }

.flash {
  position: absolute; left: 50%; top: 38%; transform: translateX(-50%); font-family: var(--font-display); font-weight: 900;
  text-transform: uppercase; font-size: clamp(1.6rem, 4vw, 2.6rem); color: var(--ink); text-shadow: 0 3px 14px rgba(0, 0, 0, 0.8); white-space: nowrap;
}
.flash.in { animation: pop 0.4s ease-out; }

.toast {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  background: var(--panel); padding: 8px 14px; font-size: var(--step--1); font-weight: 600; letter-spacing: 0.03em; max-width: calc(100% - 32px); text-align: center;
}

.icons { position: absolute; inset: 0; }
.ricon {
  position: absolute; left: 0; top: 0; width: 34px; height: 34px; padding: 6px; border-radius: 50%; border: 2px solid currentColor;
  background: rgba(8, 10, 14, 0.82); cursor: pointer; pointer-events: auto; will-change: transform;
}
.ricon svg { width: 100%; height: 100%; display: block; }
.ricon .rkey {
  position: absolute; right: -8px; bottom: -6px; background: var(--ink); color: #111; font-size: 0.68rem; font-weight: 800;
  width: 16px; height: 16px; display: grid; place-items: center; border-radius: 3px;
}
.g-cross { color: #6aa8ff; }
.g-circle { color: #ff6363; }
.g-tri { color: #3ee08f; }
.g-square { color: #ff7fdc; }
.g-r1 { color: #d7dbe3; }

.meter {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px));
  width: min(420px, calc(100% - 32px)); display: grid; gap: 6px; text-align: center;
}
.meter-label { font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; font-size: var(--step--1); }
.meter-bar { position: relative; height: 16px; background: linear-gradient(90deg, var(--red), #f59e0b 30%, #22c55e 47%, #22c55e 53%, #f59e0b 70%, var(--red)); }
.meter-zone { position: absolute; left: 42.5%; width: 15%; top: -3px; bottom: -3px; border: 2px solid #fff; }
.meter-needle { position: absolute; top: -8px; bottom: -8px; width: 4px; margin-left: -2px; background: #fff; box-shadow: 0 0 8px #000; }

.playcall {
  position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(76px + env(safe-area-inset-bottom, 0px));
  width: min(1180px, calc(100% - 32px)); max-height: 56vh; display: grid; grid-template-rows: auto minmax(0, 1fr);
  background: var(--panel); border-top: 4px solid var(--c1, var(--team)); pointer-events: auto; backdrop-filter: blur(6px);
}
.pc-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 14px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.pc-side { font-family: var(--font-display); font-weight: 900; text-transform: uppercase; font-size: var(--step-2); }
.pc-sit { font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 0.06em; }
.pc-help { margin-left: auto; color: var(--muted); font-size: var(--step--1); }
.pc-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; padding: 10px; overflow-y: auto; }
.card {
  display: grid; grid-template-rows: auto auto; background: var(--raise); border: 2px solid transparent; padding: 0; color: var(--ink);
  text-align: left; cursor: pointer; min-width: 0;
}
.card canvas { width: 100%; height: auto; aspect-ratio: 240 / 132; display: block; max-width: 100%; }
.card-meta { display: grid; gap: 1px; padding: 7px 9px 9px; min-width: 0; }
.card-meta strong { font-family: var(--font-display); font-weight: 800; font-size: 1.15rem; text-transform: uppercase; letter-spacing: 0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-meta small { color: var(--muted); font-size: var(--step--1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card-tag { font-size: 0.66rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.14em; color: var(--blue); }
.card.focus { border-color: var(--gold); background: #1c2537; }

.help {
  position: absolute; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); width: min(340px, calc(100% - 32px));
  background: var(--panel); padding: 14px 16px; pointer-events: auto; border-top: 4px solid var(--gold);
}
.help h3 { margin: 0 0 8px; font-family: var(--font-display); text-transform: uppercase; font-size: var(--step-2); }
.help dl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 12px; margin: 0; }
.help dt { color: var(--gold); font-weight: 700; font-size: var(--step--1); text-transform: uppercase; letter-spacing: 0.06em; }
.help dd { margin: 0; font-size: var(--step--1); color: #d8dde6; }
.help p { margin: 10px 0 0; color: var(--muted); font-size: var(--step--1); }

.modal { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(3, 5, 9, 0.55); pointer-events: auto; padding-inline: 16px; }
.modal-card { background: var(--panel-solid); border-top: 4px solid var(--gold); padding: 20px; display: grid; gap: 10px; width: min(320px, 100%); }
.modal-card.wide { width: min(560px, 100%); }
.modal-card h2 { margin: 0 0 6px; font-family: var(--font-display); text-transform: uppercase; font-size: var(--step-3); line-height: 1; }
.final-kicker { color: var(--gold); text-transform: uppercase; letter-spacing: 0.22em; font-weight: 700; font-size: var(--step--1); }
.final-score { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.final-score > div { background: linear-gradient(135deg, var(--c1), color-mix(in srgb, var(--c1) 45%, #000)); padding: 12px 14px; display: grid; min-width: 0; }
.final-score span { font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; font-size: var(--step--1); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.final-score b { font-family: var(--font-display); font-weight: 900; font-size: var(--step-4); line-height: 0.9; font-variant-numeric: tabular-nums; }
.final-line { margin: 4px 0; font-weight: 600; }

.stats { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: var(--step--1); }
.stats th { text-align: right; padding: 6px 8px; font-family: var(--font-display); font-size: var(--step-1); border-bottom: 3px solid var(--c1); }
.stats td { padding: 5px 8px; border-bottom: 1px solid var(--line); text-align: right; }
.stats td:first-child { text-align: left; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
.stats-pop {
  position: absolute; right: 16px; top: calc(16px + env(safe-area-inset-top, 0px)); width: min(340px, calc(100% - 32px)); background: var(--panel); padding: 12px 14px;
}
.stats-pop h3 { margin: 0 0 6px; font-family: var(--font-display); text-transform: uppercase; font-size: var(--step-2); }

.touchpad { position: absolute; left: 0; right: 0; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); height: 150px; pointer-events: none; }
.stick { position: absolute; left: 22px; bottom: 0; width: 130px; height: 130px; border-radius: 50%; background: rgba(255, 255, 255, 0.08); border: 2px solid rgba(255, 255, 255, 0.25); pointer-events: auto; touch-action: none; }
.nub { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255, 255, 255, 0.5); }
.tbtns { position: absolute; right: 16px; bottom: 0; display: grid; grid-template-columns: repeat(2, 84px); gap: 8px; pointer-events: auto; }
.tbtns button { height: 56px; background: rgba(8, 10, 14, 0.7); color: var(--ink); border: 2px solid rgba(255, 255, 255, 0.3); font-weight: 700; font-size: var(--step--1); touch-action: none; }

.playcall:not([hidden]) ~ .touchpad { display: none; }
.sb-to { display: flex; gap: 3px; margin-left: 2px; }
.sb-to i { width: 5px; height: 5px; background: rgba(255, 255, 255, 0.85); display: block; }
.sb-to i.used { background: rgba(255, 255, 255, 0.2); }

@keyframes wipe { from { clip-path: inset(0 100% 0 0); transform: skewX(-10deg) translateX(-30px); } to { clip-path: inset(0 0 0 0); transform: skewX(-10deg); } }
@keyframes slide-up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@keyframes slide-in { from { opacity: 0; transform: translateX(-16px); } to { opacity: 1; transform: none; } }
@keyframes pop { from { opacity: 0; transform: translateX(-50%) scale(1.3); } to { opacity: 1; transform: translateX(-50%) scale(1); } }

@media (prefers-reduced-motion: reduce) {
  .banner.in .banner-main, .banner.in .banner-sub, .ticker.in, .flash.in { animation: none; }
}

@media (max-width: 860px) {
  .title-screen { grid-template-columns: minmax(0, 1fr); padding-inline: 16px; align-content: start; }
  .title-brand { align-self: start; padding-bottom: 0; }
  .title-panel { align-self: start; }
  .team-list { max-height: 190px; }
  .sb-team { padding: 0 10px 0 16px; gap: 6px; }
  .sb-clock, .sb-down { padding: 0 10px; gap: 6px; }
  .sb-spot { display: none; }
  .pc-help { display: none; }
  .pc-cards { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
}
@media (max-width: 520px) {
  .matchup { grid-template-columns: minmax(0, 1fr); }
  .vs { justify-self: center; }
  .sb-abbr { font-size: 1.05rem; }
  .sb-score { font-size: 1.4rem; }
  .sb-time, .sb-dd { font-size: 1.1rem; }
  .scorebug { height: 40px; }
}
</style>
</head>
<body>
<div id="app">
  <div id="stage"></div>
